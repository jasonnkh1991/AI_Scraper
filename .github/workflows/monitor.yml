name: Monitor X List

on:
  workflow_dispatch:
    inputs:
      self_test:
        description: "Send a synthetic Telegram alert and insert a test insight"
        required: false
        type: boolean
        default: false
      bypass_market_window:
        description: "Bypass NY market window for manual diagnostics"
        required: false
        type: boolean
        default: false
      fetch_limit:
        description: "X.com fetch limit"
        required: false
        type: string
        default: "10"
      truth_social_fetch_limit:
        description: "Truth Social fetch limit"
        required: false
        type: string
        default: "3"
      truth_social_run_minutes:
        description: "Truth Social run interval gate in minutes"
        required: false
        type: string
        default: "60"

concurrency:
  group: monitor-x-list
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTER_LIST_URL: ${{ secrets.TWITTER_LIST_URL }}
          TWITTER_SEARCH_QUERY: ${{ secrets.TWITTER_SEARCH_QUERY }}
          APIFY_ACTOR_ID: pzMmk1t7AZ8OKJhfU
          SELF_TEST_MODE: ${{ inputs.self_test }}
          FETCH_LIMIT: ${{ inputs.fetch_limit || '10' }}
          BYPASS_MARKET_WINDOW: ${{ inputs.bypass_market_window }}
          TRUTH_SOCIAL_ENABLED: "true"
          TRUTH_SOCIAL_ACTOR_ID: IWIOv7oeNxfcjTnX5
          TRUTH_SOCIAL_URL: https://www.truthsocial.com/realDonaldTrump/
          TRUTH_SOCIAL_FETCH_LIMIT: ${{ inputs.truth_social_fetch_limit || '3' }}
          TRUTH_SOCIAL_RUN_MINUTES: ${{ inputs.truth_social_run_minutes || '60' }}
          MARKET_TIMEZONE: America/New_York
        run: python crawler.py
