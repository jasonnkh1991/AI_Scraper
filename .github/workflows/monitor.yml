name: Monitor X List

on:
  workflow_dispatch:
    inputs:
      self_test:
        description: "Send a synthetic Telegram alert and insert a test insight"
        required: false
        type: boolean
        default: false
      bypass_market_window:
        description: "Bypass NY market window for manual diagnostics"
        required: false
        type: boolean
        default: false
      tier1_fetch_limit:
        description: "Tier 1 X.com fetch limit during NY 06:00-24:00"
        required: false
        type: string
        default: "40"
      tier2_fetch_limit:
        description: "Tier 2 X.com fetch limit for hourly runs"
        required: false
        type: string
        default: "20"
      overnight_fetch_limit:
        description: "Tier 1 X.com fetch limit during NY 00:00-06:00"
        required: false
        type: string
        default: "10"
      max_new_tweets_per_run:
        description: "Maximum unseen tweets to evaluate with AI per run"
        required: false
        type: string
        default: "12"
      truth_social_enabled:
        description: "Enable Truth Social crawling"
        required: false
        type: boolean
        default: false
      truth_social_fetch_limit:
        description: "Truth Social fetch limit"
        required: false
        type: string
        default: "3"
      truth_social_run_minutes:
        description: "Truth Social run interval gate in minutes"
        required: false
        type: string
        default: "60"
      truth_social_diagnostic_mode:
        description: "Run only Truth Social Apify payload diagnostics"
        required: false
        type: boolean
        default: false
      truth_social_diagnostic_date:
        description: "Truth Social diagnostic start date YYYY-MM-DD"
        required: false
        type: string
        default: ""

concurrency:
  group: monitor-x-list
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTER_LIST_URL: ${{ secrets.TWITTER_LIST_URL }}
          TIER1_TWITTER_SEARCH_QUERY: ${{ secrets.TIER1_TWITTER_SEARCH_QUERY }}
          TIER2_TWITTER_SEARCH_QUERY: ${{ secrets.TIER2_TWITTER_SEARCH_QUERY }}
          APIFY_ACTOR_ID: pzMmk1t7AZ8OKJhfU
          SELF_TEST_MODE: ${{ inputs.self_test }}
          FETCH_LIMIT: ${{ inputs.tier1_fetch_limit || '40' }}
          TIER2_FETCH_LIMIT: ${{ inputs.tier2_fetch_limit || '20' }}
          OVERNIGHT_FETCH_LIMIT: ${{ inputs.overnight_fetch_limit || '10' }}
          MAX_NEW_TWEETS_PER_RUN: ${{ inputs.max_new_tweets_per_run || '12' }}
          OPENAI_TIMEOUT_SECONDS: "25"
          OPENAI_MAX_RETRIES: "1"
          BYPASS_MARKET_WINDOW: ${{ inputs.bypass_market_window }}
          TRUTH_SOCIAL_ENABLED: ${{ inputs.truth_social_enabled || false }}
          TRUTH_SOCIAL_ACTOR_ID: IWIOv7oeNxfcjTnX5
          TRUTH_SOCIAL_URL: https://www.truthsocial.com/realDonaldTrump/
          TRUTH_SOCIAL_FETCH_LIMIT: ${{ inputs.truth_social_fetch_limit || '3' }}
          TRUTH_SOCIAL_RUN_MINUTES: ${{ inputs.truth_social_run_minutes || '60' }}
          TRUTH_SOCIAL_DIAGNOSTIC_MODE: ${{ inputs.truth_social_diagnostic_mode }}
          TRUTH_SOCIAL_DIAGNOSTIC_DATE: ${{ inputs.truth_social_diagnostic_date }}
          TRUTH_SOCIAL_MAX_TOTAL_CHARGE_USD: "0.02"
          MARKET_TIMEZONE: America/New_York
        run: python crawler.py
