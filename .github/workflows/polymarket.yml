name: Monitor Polymarket

on:
  workflow_dispatch:
    inputs:
      send_digest:
        description: "Send the Polymarket market brief after the radar run"
        required: false
        type: boolean
        default: false
      force_digest:
        description: "Bypass digest dedupe gate"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: monitor-polymarket
  cancel-in-progress: false

jobs:
  monitor-polymarket:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Polymarket radar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          DIGEST_API_KEY: ${{ secrets.DIGEST_API_KEY }}
          DIGEST_BASE_URL: ${{ secrets.DIGEST_BASE_URL }}
          DIGEST_MODEL: ${{ secrets.DIGEST_MODEL }}
          POLYMARKET_ENABLED: "true"
          POLYMARKET_DISCOVERY_ENABLED: "true"
          POLYMARKET_EXTERNAL_DISCOVERY_ENABLED: "true"
          POLYMARKET_APIFY_FALLBACK_ENABLED: "false"
          POLYMARKET_MAX_ACTIVE_MARKETS: "60"
          POLYMARKET_EXTERNAL_TERM_LIMIT: "20"
          POLYMARKET_DISCOVERY_MIN_VOLUME_24H: "5000"
          POLYMARKET_DISCOVERY_MIN_LIQUIDITY: "2000"
          POLYMARKET_SIGNAL_MIN_MOVE_15M: "0.08"
          POLYMARKET_SIGNAL_MIN_MOVE_1H: "0.12"
          POLYMARKET_SIGNAL_MIN_MOVE_6H: "0.20"
          POLYMARKET_SIGNAL_MIN_MOVE_24H: "0.30"
          POLYMARKET_SIGNAL_MIN_QUALITY: "70"
          POLYMARKET_TRANSLATION_ENABLED: "true"
          POLYMARKET_TRANSLATION_MODEL: ${{ secrets.DIGEST_MODEL || secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
          POLYMARKET_TRANSLATION_BASE_URL: ${{ secrets.DIGEST_BASE_URL || secrets.OPENAI_BASE_URL }}
          POLYMARKET_TRANSLATION_API_KEY: ${{ secrets.DIGEST_API_KEY || secrets.OPENAI_API_KEY }}
          POLYMARKET_DIGEST_ENABLED: ${{ github.event.inputs.send_digest || 'false' }}
          POLYMARKET_DIGEST_FORCE: ${{ github.event.inputs.force_digest || 'false' }}
          POLYMARKET_DIGEST_MODEL: ${{ secrets.DIGEST_MODEL || 'gemini-3-flash-preview' }}
          POLYMARKET_DIGEST_BASE_URL: ${{ secrets.DIGEST_BASE_URL || secrets.OPENAI_BASE_URL }}
          POLYMARKET_DIGEST_API_KEY: ${{ secrets.DIGEST_API_KEY || secrets.OPENAI_API_KEY }}
          POLYMARKET_DIGEST_MAX_TOPICS: "5"
          POLYMARKET_DIGEST_MARKETS_PER_TOPIC: "3"
          POLYMARKET_DIGEST_MIN_VOLUME_24H: "1000"
          POLYMARKET_DIGEST_MIN_LIQUIDITY: "2000"
          POLYMARKET_DIGEST_DEDUPE_HOURS: "6"
          POLYMARKET_SNAPSHOT_RETENTION_DAYS: "14"
          POLYMARKET_SIGNAL_RETENTION_DAYS: "180"
        run: python polymarket_monitor.py
